<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S#1 • Agente en Vivo</title>
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px; display: flex; flex-direction: column; align-items: center;
    }
    .shell {
      width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px;
      min-height: calc(100vh - 32px);
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-radius: 14px; background: #0a0a0a; border: 1px solid #262626;
    }
    .live-pill {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem;
      font-weight: 700; letter-spacing: 0.8px; padding: 4px 10px; border-radius: 999px;
      border: 1px solid #333; background: #000;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #fff;
      animation: pulseDot 1.6s infinite;
    }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .btn-sm {
      padding: 6px 11px; border-radius: 9px; font-size: 0.74rem; font-weight: 600;
      background: #141414; color: #fff; border: 1px solid #333; cursor: pointer;
    }

    /* MARCO DE VIDEOLLAMADA */
    .call-stage {
      position: relative; border-radius: 20px; background: radial-gradient(circle at center, #141414 0%, #050505 70%);
      border: 1px solid #262626; padding: 28px 20px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;
    }
    .agent-orb {
      width: 86px; height: 86px; border-radius: 50%; border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; background: #000;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .agent-orb.speaking {
      animation: voicePulse 0.9s ease-in-out infinite;
    }
    @keyframes voicePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.28); }
      50% { transform: scale(1.08); box-shadow: 0 0 0 18px rgba(255,255,255,0.03); }
    }

    .agent-state { font-size: 0.72rem; color: #8e8e93; letter-spacing: 1.5px; text-transform: uppercase; }

    /* SUBTÍTULOS EN VIVO */
    .subtitle-box {
      width: 100%; min-height: 82px; padding: 14px; border-radius: 14px;
      background: rgba(0, 0, 0, 0.75); border: 1px solid #262626;
      font-size: 0.9rem; line-height: 1.5; color: #f4f4f5; text-align: left;
    }
    .closing-prompt {
      margin-top: 8px; padding-top: 8px; border-top: 1px solid #222;
      font-size: 0.82rem; color: #fff; font-weight: 700;
    }

    /* BOTONES DE RESPUESTA RÁPIDA / CIERRE */
    .quick-replies {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .chip-btn {
      flex: 1 1 calc(50% - 4px); padding: 11px 10px; border-radius: 12px;
      background: #0a0a0a; border: 1px solid #333; color: #e4e4e7;
      font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center;
      transition: all 0.15s ease;
    }
    .chip-btn:active, .chip-btn.cta { background: #fff; color: #000; border-color: #fff; }

    /* INPUT LIBRE */
    .input-bar {
      display: flex; gap: 8px; margin-top: auto;
    }
    .input-bar input {
      flex: 1; padding: 13px 14px; border-radius: 12px; background: #0a0a0a;
      border: 1px solid #333; color: #fff; font-size: 0.88rem;
    }
    .input-bar button {
      padding: 0 18px; border-radius: 12px; background: #fff; color: #000;
      border: none; font-weight: 800; font-size: 0.9rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="live-pill"><span class="live-dot"></span> AGENTE EN VIVO</span>
      <div style="display:flex; gap:6px;">
        <button type="button" id="btn-toggle-voice" class="btn-sm">🔊 Voz: ON</button>
        <button type="button" id="btn-back" class="btn-sm">← Volver</button>
      </div>
    </header>

    <!-- PANTALLA DE VIDEOLLAMADA -->
    <section class="call-stage">
      <div id="agent-orb" class="agent-orb">S</div>
      <div id="agent-state" class="agent-state">Conectado • Esperando consulta</div>

      <div class="subtitle-box">
        <div id="agent-speech">
          Bienvenido. Soy el agente técnico de S#1. Resuelvo tus dudas sobre infraestructura, seguridad o licencia en segundos.
        </div>
        <div id="agent-closing" class="closing-prompt">
          ¿Qué quieres validar primero para avanzar con tu cupo?
        </div>
      </div>
    </section>

    <!-- OPCIONES DINÁMICAS DE CIERRE -->
    <div id="quick-replies" class="quick-replies"></div>

      <!-- INPUT DE PREGUNTA LIBRE + MICRÓFONO NATIVO -->
    <form id="agent-form" class="input-bar">
      <button type="button" id="btn-mic" title="Hablar" style="padding:0 14px; background:#141414; color:#fff; border:1px solid #333;">🎤</button>
      <input type="text" id="agent-input" placeholder="Habla o escribe tu duda..." autocomplete="off" />
      <button type="submit">➔</button>
    </form>

  <script src="/js/biometria.js"></script>
  <script src="/js/agente.js"></script>
</body>
</html>
