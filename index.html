<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S#1 • Acceso</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/jpeg" href="/icon.jpg">
  <link rel="apple-touch-icon" href="/icon.jpg">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%; max-width: 380px; padding: 28px 24px; border-radius: 20px;
      background: #0a0a0a; border: 1px solid #262626;
      display: flex; flex-direction: column; gap: 14px;
    }
    .logo-box { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 6px; }
    .logo-box img { width: 64px; height: 64px; border-radius: 50%; border: 1px solid #333; }
    h1 { margin: 0; font-size: 1.25rem; letter-spacing: 2px; font-weight: 700; }
    .sub { margin: 0; font-size: 0.8rem; color: #a1a1aa; text-align: center; }
    .role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .role-btn {
      padding: 10px; border-radius: 10px; border: 1px solid #333; background: #000;
      color: #a1a1aa; font-weight: 600; font-size: 0.82rem; cursor: pointer;
    }
    .role-btn.active { background: #fff; color: #000; border-color: #fff; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; font-size: 0.92rem;
      background: #000; border: 1px solid #333; color: #fff;
    }
    button.action {
      width: 100%; padding: 13px; border-radius: 12px; font-size: 0.92rem; font-weight: 700; cursor: pointer;
    }
    .btn-white { background: #fff; color: #000; border: none; }
    .btn-outline { background: transparent; color: #fff; border: 1px solid #404040; }
    .btn-install {
      background: #141414; color: #e4e4e7; border: 1px dashed #52525b;
      padding: 10px; font-size: 0.8rem; border-radius: 10px; cursor: pointer;
    }
    #bio-status { font-size: 0.82rem; text-align: center; color: #d4d4d8; min-height: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-box">
      <img src="/icon.svg" alt="Logo">
      <h1>S#1</h1>
      <p class="sub">Entorno de Simulación Biométrica</p>
    </div>

    <div class="role-tabs">
      <button type="button" class="role-btn active" data-role="ADMIN">ADMIN</button>
      <button type="button" class="role-btn" data-role="SUPERVISOR">SUPERVISOR</button>
    </div>

    <input type="text" id="bio-user-id" value="ADMIN" readonly />

    <button type="button" id="btn-bio-register" class="action btn-outline">
      1. Registrar Biometría (Huella / Face ID)
    </button>

    <button type="button" id="btn-bio-login" class="action btn-white">
      2. Entrar al Flujo
    </button>

    <button type="button" id="btn-install-pwa" class="btn-install">
      ⬇ Instalar Web App en este dispositivo
    </button>

    <div id="bio-status"></div>
  </main>

  <script src="/js/biometria.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    const statusEl = document.getElementById('bio-status');
    const userInput = document.getElementById('bio-user-id');

    // Selector rápido ADMIN / SUPERVISOR
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        userInput.value = btn.dataset.role;
        statusEl.textContent = '';
      });
    });

    // 1. Registrar
    document.getElementById('btn-bio-register').addEventListener('click', async () => {
      statusEl.textContent = 'Esperando sensor biométrico...';
      const res = await SodieBiometria.registrar(userInput.value);
      statusEl.textContent = res.ok ? `✅ Biometría registrada para ${res.userId}.` : `❌ ${res.error}`;
    });

    // 2. Validar y entrar al flujo simulado
    document.getElementById('btn-bio-login').addEventListener('click', async () => {
      statusEl.textContent = 'Validando biometría...';
      const res = await SodieBiometria.validar(userInput.value);
      if (res.ok) {
        window.location.href = '/flujo.html';
      } else {
        statusEl.textContent = `❌ ${res.error}`;
      }
    });

    // 3. Instalación PWA (Android automático / iOS guía directa)
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    document.getElementById('btn-install-pwa').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      } else {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        statusEl.textContent = isIOS
          ? 'En Safari (iOS): toca Compartir (↑) y luego "Agregar a inicio".'
          : 'En Chrome: abre el menú (⋮) y toca "Instalar aplicación".';
      }
    });
  </script>
</body>
</html>
