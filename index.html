<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Biometría</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0218; color: #fff; font-family: system-ui, sans-serif; padding: 16px;
    }
    .card {
      width: 100%; max-width: 380px; padding: 24px; border-radius: 16px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(0,255,204,0.35);
      display: flex; flex-direction: column; gap: 14px;
    }
    h2 { margin: 0; color: #00ffcc; text-align: center; }
    input, button {
      width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; font-size: 0.95rem;
    }
    input {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: #fff;
    }
    button { border: none; font-weight: 700; cursor: pointer; }
    .btn-mint { background: #00ffcc; color: #0b0218; }
    .btn-fuchsia { background: #d946ef; color: #fff; }
    #bio-status { font-size: 0.85rem; text-align: center; color: #cbd5e1; min-height: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <h2>Acceso Biométrico</h2>
    <input type="text" id="bio-user-id" placeholder="ID de usuario (ej. ADMIN o CLIENT-#01)" value="ADMIN" />

    <button type="button" id="btn-bio-register" class="btn-fuchsia">
      1. Registrar Huella / Face ID
    </button>

    <button type="button" id="btn-bio-login" class="btn-mint">
      2. Entrar con Biometría
    </button>

    <div id="bio-status"></div>
  </main>

  <script src="/js/biometria.js"></script>
  <script>
    const statusEl = document.getElementById('bio-status');
    const getUserId = () => document.getElementById('bio-user-id').value.trim() || 'ADMIN';

      <script src="/js/biometria.js"></script>
  <script>
    const statusEl = document.getElementById('bio-status');
    const getUserId = () => document.getElementById('bio-user-id').value.trim() || 'ADMIN';

    // Botón 1: Registrar (este era el que faltaba)
    document.getElementById('btn-bio-register').addEventListener('click', async () => {
      statusEl.textContent = 'Esperando sensor biométrico...';
      const res = await SodieBiometria.registrar(getUserId());
      statusEl.textContent = res.ok ? '✅ Huella registrada. Ya puedes entrar.' : `❌ ${res.error}`;
    });

    // Botón 2: Entrar y redirigir según el rol
    document.getElementById('btn-bio-login').addEventListener('click', async () => {
      statusEl.textContent = 'Validando biometría...';
      const res = await SodieBiometria.validar(getUserId());
      if (res.ok) {
        if (res.role === 'ADMIN') {
          window.location.href = '/panel.html';
        } else {
          window.location.href = '/supervisor.html';
        }
      } else {
        statusEl.textContent = `❌ ${res.error}`;
      }
    });
  </script>
</body>
</html>
